server {
    listen 80;
    server_name _;

    # Docker can assign a new IP when the API container is recreated. Resolve
    # the service name at request time instead of pinning its startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /live/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $live_upstream worker:6080;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://$live_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;

        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
